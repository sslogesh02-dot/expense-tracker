<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Expenses Tracker</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-primary:active {
      background: var(--primary-dark);
    }

    .content-area {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .hero-stat {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fff;
      padding: 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    .hero-stat .label {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .hero-stat .val {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .person-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .person-card:active {
      background: #f1f5f9;
      transform: scale(0.99);
    }

    .person-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-right: 12px;
    }

    .person-info {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .person-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .person-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .person-total {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-align: right;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-back {
      background: #f1f5f9;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .expense-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .expense-note {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .expense-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .expense-right {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .expense-amt {
      font-weight: 700;
      color: var(--danger);
      font-size: 1rem;
    }

    .btn-del {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    .btn-del:hover {
      color: var(--danger);
    }

    .empty-text {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
      font-size: 0.9rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-content {
      background: var(--surface);
      width: 100%;
      max-width: 520px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <h2 style="font-size: 1.1rem; font-weight: 700;">Expense Tracker</h2>
      <button class="btn-primary" onclick="openModal()">+ Add Expense</button>
    </header>

    <!-- Main View: Members Overview -->
    <div id="homeView" class="content-area">
      <div class="hero-stat">
        <div class="label">Total Spent by Everyone</div>
        <div class="val" id="grandTotal">₹0.00</div>
      </div>
      <div class="section-title">Members</div>
      <div id="membersList"></div>
    </div>

    <!-- Detail View: Single Member Ledger -->
    <div id="detailView" class="content-area" style="display: none;">
      <div class="detail-header">
        <button class="btn-back" onclick="showHome()">← Back</button>
        <div>
          <h3 id="detailMemberName" style="font-size: 1.1rem;">Person A</h3>
          <div id="detailMemberTotal" style="font-size: 0.85rem; color: var(--text-muted);">Total: ₹0.00</div>
        </div>
      </div>
      <div class="section-title">Expense History</div>
      <div id="detailExpenseList"></div>
    </div>
  </div>

  <!-- Add Expense Modal -->
  <div class="modal-backdrop" id="expenseModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.1rem;">Add Expense</h3>
        <button onclick="closeModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <form id="addForm" onsubmit="saveExpense(event)">
        <div class="form-group">
          <label>Who spent?</label>
          <select id="memberSelect" required>
            <option value="Person A">Person A</option>
            <option value="Person B">Person B</option>
            <option value="Person C">Person C</option>
            <option value="Person D">Person D</option>
            <option value="Person E">Person E</option>
          </select>
        </div>
        <div class="form-group" style="margin-top: 10px;">
          <label>Amount (₹)</label>
          <input type="number" step="0.01" id="amountInput" placeholder="0.00" required />
        </div>
        <div class="form-group" style="margin-top: 10px;">
          <label>Note / Purpose</label>
          <input type="text" id="noteInput" placeholder="e.g. Fuel, Lunch, Stationery" required />
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; margin-top: 16px; font-size: 1rem;">
          Save Expense
        </button>
      </form>
    </div>
  </div>

  <script>
    const MEMBERS = ['Person A', 'Person B', 'Person C', 'Person D', 'Person E'];
    let expenses = JSON.parse(localStorage.getItem('expenses_data')) || [];
    let currentDetailMember = null;

    function formatINR(val) {
      return '₹' + Number(val).toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function persist() {
      localStorage.setItem('expenses_data', JSON.stringify(expenses));
      render();
    }

    function render() {
      const grandTotal = expenses.reduce((acc, curr) => acc + curr.amount, 0);
      document.getElementById('grandTotal').innerText = formatINR(grandTotal);

      // Render Members
      const membersList = document.getElementById('membersList');
      membersList.innerHTML = '';

      MEMBERS.forEach(member => {
        const memExpenses = expenses.filter(e => e.person === member);
        const total = memExpenses.reduce((acc, curr) => acc + curr.amount, 0);

        const card = document.createElement('div');
        card.className = 'person-card';
        card.onclick = () => showDetail(member);
        card.innerHTML = `
          <div class="person-info">
            <div class="person-avatar">${member.replace('Person ', '')}</div>
            <div>
              <div class="person-name">${member}</div>
              <div class="person-sub">${memExpenses.length} transaction${memExpenses.length === 1 ? '' : 's'}</div>
            </div>
          </div>
          <div class="person-total">${formatINR(total)}</div>
        `;
        membersList.appendChild(card);
      });

      // If Detail is active, update it
      if (currentDetailMember) {
        showDetail(currentDetailMember);
      }
    }

    function showDetail(member) {
      currentDetailMember = member;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';

      const memExpenses = expenses.filter(e => e.person === member);
      const total = memExpenses.reduce((acc, curr) => acc + curr.amount, 0);

      document.getElementById('detailMemberName').innerText = member;
      document.getElementById('detailMemberTotal').innerText = `Total: ${formatINR(total)}`;

      const list = document.getElementById('detailExpenseList');
      list.innerHTML = '';

      if (memExpenses.length === 0) {
        list.innerHTML = '<div class="empty-text">No expenses recorded for this person yet.</div>';
        return;
      }

      memExpenses.forEach(item => {
        const row = document.createElement('div');
        row.className = 'expense-row';
        row.innerHTML = `
          <div>
            <div class="expense-note">${item.note}</div>
            <div class="expense-date">${item.date}</div>
          </div>
          <div class="expense-right">
            <div class="expense-amt">-${formatINR(item.amount)}</div>
            <button class="btn-del" title="Delete" onclick="deleteExpense(${item.id})">×</button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function showHome() {
      currentDetailMember = null;
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
    }

    function openModal() {
      document.getElementById('expenseModal').style.display = 'flex';
      if (currentDetailMember) {
        document.getElementById('memberSelect').value = currentDetailMember;
      }
    }

    function closeModal() {
      document.getElementById('expenseModal').style.display = 'none';
      document.getElementById('addForm').reset();
    }

    function saveExpense(e) {
      e.preventDefault();
      const person = document.getElementById('memberSelect').value;
      const amount = parseFloat(document.getElementById('amountInput').value);
      const note = document.getElementById('noteInput').value.trim();

      if (!note || isNaN(amount) || amount <= 0) return;

      const dateStr = new Date().toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });

      expenses.unshift({ id: Date.now(), person, amount, note, date: dateStr });
      closeModal();
      persist();
    }

    function deleteExpense(id) {
      expenses = expenses.filter(item => item.id !== id);
      persist();
    }

    render();
  </script>
</body>
</html>
